# UI-only. Copy dist/ to /var/www/mitdo/dist and enable this site.
# Point mitdo.cloud DNS A record at the EC2 public IP.

server {
  listen 80;
  listen [::]:80;
  server_name mitdo.cloud www.mitdo.cloud;

  root /var/www/mitdo/dist;
  index index.html;

  location /assets/ {
    expires 7d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
