# Build the production bundle and rsync it to the Ubuntu EC2 host behind mitdo.cloud.
#
# Repo secrets (or environment mitdo-cloud):
#   EC2_HOST              public IP or mitdo.cloud
#   EC2_SSH_PRIVATE_KEY   private key whose public half is in ubuntu@host:~/.ssh/authorized_keys
# Optional:
#   EC2_USER              default ubuntu
#   EC2_SSH_PORT          default 22
#
# One-time on the instance:
#   sudo apt-get update && sudo apt-get install -y nginx rsync
#   sudo mkdir -p /var/www/mitdo/dist
#   sudo chown -R ubuntu:ubuntu /var/www/mitdo
#   sudo cp deploy/nginx.mitdo.cloud.conf /etc/nginx/sites-available/mitdo.cloud
#   sudo ln -sf /etc/nginx/sites-available/mitdo.cloud /etc/nginx/sites-enabled/mitdo.cloud
#   sudo rm -f /etc/nginx/sites-enabled/default
#   echo 'ubuntu ALL=(ALL) NOPASSWD: /usr/sbin/nginx, /bin/systemctl' | sudo tee /etc/sudoers.d/mitdo-nginx
#   sudo chmod 440 /etc/sudoers.d/mitdo-nginx
#   sudo nginx -t && sudo systemctl enable --now nginx
name: deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: deploy-mitdo-cloud
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: mitdo-cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > ~/.ssh/ec2
          chmod 600 ~/.ssh/ec2
          ssh-keyscan -p "${{ secrets.EC2_SSH_PORT || 22 }}" -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Publish dist
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
          EC2_PORT: ${{ secrets.EC2_SSH_PORT || 22 }}
        run: |
          set -euo pipefail
          remote="${EC2_USER}@${EC2_HOST}"
          ssh_opts=(-i ~/.ssh/ec2 -p "$EC2_PORT" -o IdentitiesOnly=yes)
          rsync -az --delete -e "ssh ${ssh_opts[*]}" dist/ "${remote}:/var/www/mitdo/dist/"
          rsync -az -e "ssh ${ssh_opts[*]}" deploy/nginx.mitdo.cloud.conf "${remote}:/tmp/nginx.mitdo.cloud.conf"
          ssh "${ssh_opts[@]}" "$remote" 'set -euo pipefail
            sudo cp /tmp/nginx.mitdo.cloud.conf /etc/nginx/sites-available/mitdo.cloud
            sudo ln -sf /etc/nginx/sites-available/mitdo.cloud /etc/nginx/sites-enabled/mitdo.cloud
            sudo nginx -t
            sudo systemctl reload nginx
          '
