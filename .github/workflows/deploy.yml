name: deploy production S3

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: deploy-mitdo-cloud-s3
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build and deploy to S3
    runs-on: ubuntu-latest
    environment:
      name: mitdo-cloud

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-actions-web-${{ github.run_id }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Install and build
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Upload site to S3
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
        run: |
          set -euo pipefail
          test -n "$S3_BUCKET"

          # Remove deleted files, and make HTML entry files revalidate.
          aws s3 sync dist/ "s3://$S3_BUCKET/" \
            --delete \
            --cache-control "public,max-age=0,must-revalidate" \
            --metadata-directive REPLACE

          # Vite's hashed assets are safe to cache permanently.
          aws s3 cp dist/assets/ "s3://$S3_BUCKET/assets/" \
            --recursive \
            --cache-control "public,max-age=31536000,immutable" \
            --metadata-directive REPLACE

      - name: Invalidate CloudFront
        if: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"