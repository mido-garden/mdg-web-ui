name: deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: deploy-mitdo-cloud
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: mitdo-cloud

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Diagnose GitHub OIDC configuration
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          echo "Repository: ${GITHUB_REPOSITORY}"
          echo "Ref: ${GITHUB_REF}"
          echo "Event: ${GITHUB_EVENT_NAME}"
          echo "Expected environment: mitdo-cloud"
          echo "AWS role ARN: ${AWS_ROLE_ARN:-<empty>}"
          echo "AWS region: ${AWS_REGION:-<empty>}"

          [[ -n "${AWS_ROLE_ARN:-}" ]] || {
            echo "::error::AWS_ROLE_ARN is unavailable";
            exit 1;
          }
          [[ -n "${AWS_REGION:-}" ]] || {
            echo "::error::AWS_REGION is unavailable";
            exit 1;
          }

          oidc_response="$(
            curl --fail-with-body --silent --show-error \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com"
          )"

          claims="$(
            jq -r '.value' <<< "$oidc_response" |
            python3 -c '
          import base64, json, sys
          token = sys.stdin.read().strip()
          parts = token.split(".")
          if len(parts) != 3:
              raise SystemExit("Invalid OIDC JWT")
          payload = parts[1] + "=" * (-len(parts[1]) % 4)
          data = json.loads(base64.urlsafe_b64decode(payload))
          print(json.dumps(
              {key: data.get(key) for key in ("iss", "aud", "sub")},
              indent=2
          ))
          '
          )"

          echo "OIDC token claims (JWT withheld):"
          echo "$claims"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-actions-${{ github.run_id }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Upload artifacts
        env:
          BUCKET: ${{ vars.DEPLOY_BUCKET }}
        run: |
          set -euo pipefail
          aws s3 sync dist/ "s3://${BUCKET}/dist/" --delete
          aws s3 cp deploy/nginx.mitdo.cloud.conf \
            "s3://${BUCKET}/nginx/nginx.mitdo.cloud.conf"

      - name: Deploy via SSM
        env:
          BUCKET: ${{ vars.DEPLOY_BUCKET }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          COMMAND_ID="$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --parameters "commands=[
                'set -euo pipefail',
                'aws s3 sync s3://${BUCKET}/dist/ /var/www/mitdo/dist/ --delete',
                'chown -R ubuntu:ubuntu /var/www/mitdo/dist',
                'aws s3 cp s3://${BUCKET}/nginx/nginx.mitdo.cloud.conf /etc/nginx/sites-available/mitdo.cloud',
                'ln -sf /etc/nginx/sites-available/mitdo.cloud /etc/nginx/sites-enabled/mitdo.cloud',
                'nginx -t',
                'systemctl reload nginx'
              ]" \
              --query "Command.CommandId" \
              --output text
          )"
          echo "SSM command ID: $COMMAND_ID"
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"