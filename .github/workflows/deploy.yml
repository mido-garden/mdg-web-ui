name: deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: deploy-mitdo-cloud
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: mitdo-cloud
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload artifacts to S3
        env:
          BUCKET: ${{ secrets.DEPLOY_BUCKET }}
        run: |
          set -euo pipefail
          aws s3 sync dist/ "s3://${BUCKET}/dist/" --delete
          aws s3 cp deploy/nginx.mitdo.cloud.conf "s3://${BUCKET}/nginx/nginx.mitdo.cloud.conf"

      - name: Deploy on EC2 via SSM
        env:
          BUCKET: ${{ secrets.DEPLOY_BUCKET }}
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              'set -euo pipefail',
              'aws s3 sync s3://${BUCKET}/dist/ /var/www/mitdo/dist/ --delete',
              'chown -R ubuntu:ubuntu /var/www/mitdo/dist',
              'aws s3 cp s3://${BUCKET}/nginx/nginx.mitdo.cloud.conf /etc/nginx/sites-available/mitdo.cloud',
              'ln -sf /etc/nginx/sites-available/mitdo.cloud /etc/nginx/sites-enabled/mitdo.cloud',
              'nginx -t',
              'systemctl reload nginx'
            ]" \
            --query "Command.CommandId" \
            --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"
